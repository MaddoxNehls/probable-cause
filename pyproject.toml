[project]
name = "probable-cause"
version = "0.1.0"
description = "Benchmarked RAG over NTSB aviation accident investigations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pypdf[crypto]>=5.1",
    "typer>=0.15",
]

[project.scripts]
pc = "probable_cause.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs Docker (testcontainers Postgres)"]
